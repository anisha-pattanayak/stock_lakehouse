---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: stock-lakehouse
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'stock-api'
        static_configs:
          - targets: ['stock-api-svc:8000']
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka-svc:9101']
